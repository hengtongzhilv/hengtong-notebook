<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>亨通记事本</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F5F4F0;color:#2C2C2C;min-height:100vh}

    /* LOGIN */
    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1C3A8F 0%,#0D1F5C 100%)}
    .login-box{background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.25);text-align:center;margin:20px}
    .login-logo{width:60px;height:60px;background:#1C3A8F;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;margin:0 auto 20px;letter-spacing:-1px}
    .login-title{font-size:22px;font-weight:700;color:#1C1A17;margin-bottom:6px}
    .login-sub{font-size:13px;color:#999;margin-bottom:32px}
    .login-input{width:100%;padding:14px 18px;border:2px solid #E8E6E0;border-radius:12px;font-size:16px;font-family:inherit;letter-spacing:3px;text-align:center;text-transform:uppercase;color:#1C3A8F;font-weight:600;outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:12px}
    .login-input:focus{border-color:#1C3A8F;box-shadow:0 0 0 3px rgba(28,58,143,.12)}
    .login-input::placeholder{color:#ccc;letter-spacing:1px;font-weight:400;text-transform:none}
    .login-btn{width:100%;padding:14px;background:#1C3A8F;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s,transform .15s}
    .login-btn:hover{background:#162D78;transform:translateY(-1px)}
    .login-error{color:#E63946;font-size:12.5px;margin-top:10px;height:18px;transition:opacity .2s}
    .login-error.show{opacity:1}
    .login-error.hide{opacity:0}
    .login-footer{margin-top:28px;font-size:11px;color:rgba(255,255,255,.4)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .shake{animation:shake .4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    #appScreen.fade-in{animation:fadeIn .4s ease}

    /* APP */
    #appScreen{display:none}
    header{background:#1C3A8F;padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(28,58,143,.15)}
    .header-left{display:flex;align-items:center;gap:14px}
    .logo{width:40px;height:40px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#1C3A8F;letter-spacing:-.5px;flex-shrink:0}
    .brand{display:flex;flex-direction:column}
    .brand-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:1px}
    .brand-sub{font-size:10px;color:rgba(255,255,255,.55);letter-spacing:2px;text-transform:uppercase}
    .header-right{display:flex;align-items:center;gap:10px}
    .stat-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.85);font-weight:500}
    .stat-chip strong{color:#FFD166}
    .user-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 14px;font-size:12px;color:#fff;font-weight:500}
    .logout-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.75);cursor:pointer;font-family:inherit;transition:background .2s;display:flex;align-items:center;gap:5px}
    .logout-btn:hover{background:rgba(255,255,255,.2)}

    .controls-bar{max-width:1200px;margin:32px auto 0;padding:0 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .search-wrap{position:relative;flex:1;min-width:200px}
    .search-wrap input{width:100%;padding:10px 16px 10px 40px;border:1.5px solid #D9D7CF;border-radius:10px;background:#fff;font-size:14px;font-family:inherit;color:#2C2C2C;outline:none;transition:border-color .2s,box-shadow .2s}
    .search-wrap input:focus{border-color:#1C3A8F;box-shadow:0 0 0 3px rgba(28,58,143,.1)}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;color:#999}
    .filter-select{padding:10px 14px;border:1.5px solid #D9D7CF;border-radius:10px;background:#fff;font-size:13px;font-family:inherit;color:#2C2C2C;outline:none;cursor:pointer}
    .btn{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
    .btn-primary{background:#1C3A8F;color:#fff}
    .btn-primary:hover{background:#162D78;transform:translateY(-1px);box-shadow:0 4px 12px rgba(28,58,143,.3)}
    .btn-ghost{background:#fff;color:#666;border:1.5px solid #D9D7CF}
    .btn-ghost:hover{border-color:#1C3A8F;color:#1C3A8F}

    .container{max-width:1200px;margin:20px auto 60px;padding:0 24px}
    .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .list-title{font-size:13px;color:#888;font-weight:500}
    .list-title span{color:#1C3A8F;font-weight:700}
    .card-list{display:flex;flex-direction:column;gap:12px}

    .card{background:#fff;border-radius:14px;padding:20px 24px;border:1.5px solid #EBEBEA;transition:box-shadow .25s,transform .25s,border-color .25s;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:14px 0 0 14px}
    .card[data-priority="5"]::before{background:#E63946}
    .card[data-priority="4"]::before{background:#F4845F}
    .card[data-priority="3"]::before{background:#F7C948}
    .card[data-priority="2"]::before{background:#90BE6D}
    .card[data-priority="1"]::before{background:#8D99AE}
    .card:hover{box-shadow:0 6px 24px rgba(0,0,0,.08);border-color:#D0CEc8;transform:translateY(-1px)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
    .customer-name{font-size:17px;font-weight:700;color:#1C1A17;margin-bottom:4px}
    .customer-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .meta-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#888}
    .meta-item .icon{font-size:13px;opacity:.7}
    .meta-item a{color:#1C3A8F;text-decoration:none;font-weight:500}
    .meta-item a:hover{text-decoration:underline}
    .stars{display:flex;align-items:center;gap:2px}
    .star{font-size:16px}
    .star.filled{color:#F7C948}
    .star.empty{color:#E8E6E0}
    .card-status{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;flex-shrink:0}
    .status-new{background:#EEF2FF;color:#4F46E5}
    .status-following{background:#FFF7ED;color:#D97706}
    .status-active{background:#F0FDF4;color:#16A34A}
    .status-done{background:#F9FAFB;color:#9CA3AF}
    .card-divider{height:1px;background:#F0EEE9;margin:12px 0}
    .card-note{font-size:13.5px;color:#555;line-height:1.7;margin-bottom:12px}
    .card-footer{display:flex;align-items:center;justify-content:space-between}
    .card-actions{display:flex;gap:6px}
    .icon-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid #E8E6E0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;color:#888}
    .icon-btn:hover{border-color:#1C3A8F;color:#1C3A8F;background:#EEF2FF}
    .icon-btn.delete:hover{border-color:#E63946;color:#E63946;background:#FFF0F0}
    .card-date{font-size:11.5px;color:#B0ADA5}

    .empty{text-align:center;padding:80px 24px}
    .empty-icon{font-size:56px;margin-bottom:16px;opacity:.4}
    .empty-title{font-size:18px;font-weight:600;color:#555;margin-bottom:8px}
    .empty-desc{font-size:14px;color:#999}

    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
    .modal-overlay.active{display:flex}
    .modal{background:#fff;border-radius:18px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal-header{padding:24px 28px 20px;border-bottom:1px solid #F0EEE9;display:flex;align-items:center;justify-content:space-between}
    .modal-header h2{font-size:17px;font-weight:700;color:#1C1A17}
    .modal-close{width:32px;height:32px;border-radius:8px;border:none;background:#F5F4F0;cursor:pointer;font-size:18px;color:#666;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .modal-close:hover{background:#E8E6E0}
    .modal-body{padding:24px 28px;display:flex;flex-direction:column;gap:18px}
    .form-row{display:flex;flex-direction:column;gap:6px}
    .form-row label{font-size:12.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.5px}
    .form-row input,.form-row textarea,.form-row select{padding:11px 14px;border:1.5px solid #D9D7CF;border-radius:10px;font-size:14px;font-family:inherit;color:#2C2C2C;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
    .form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:#1C3A8F;box-shadow:0 0 0 3px rgba(28,58,143,.1)}
    .form-row textarea{resize:vertical;min-height:90px;line-height:1.6}
    .star-picker{display:flex;gap:6px;align-items:center}
    .star-picker .star-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid #E0DDD5;background:transparent;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .star-picker .star-btn:hover,.star-picker .star-btn.active{background:#FFF9E6;border-color:#F7C948}
    .priority-label{font-size:12px;color:#888;margin-top:2px}
    .modal-footer{padding:16px 28px 24px;display:flex;gap:10px;justify-content:flex-end}

    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1C2C2C;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:500;z-index:300;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:640px){
      header{padding:0 16px}
      .brand-sub{display:none}
      .controls-bar{padding:0 16px;margin-top:20px}
      .container{padding:0 16px;margin-top:14px}
      .card{padding:16px}
      .card-top{flex-direction:column;gap:10px}
      .modal{border-radius:14px}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">亨</div>
    <div class="login-title">亨通记事本</div>
    <div class="login-sub">请输入您的登录密码</div>
    <input type="password" id="loginInput" class="login-input" placeholder="例如：HT-LK8B-E2RF" maxlength="20" autocomplete="off" spellcheck="false" />
    <button class="login-btn" id="loginBtn">登录</button>
    <div class="login-error hide" id="loginError">密码错误，请检查后重试</div>
    <div class="login-footer">亨通内部工具 · 请勿转发</div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <header>
    <div class="header-left">
      <div class="logo">亨</div>
      <div class="brand">
        <span class="brand-name">亨通记事本</span>
        <span class="brand-sub">客户管理</span>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-chip">客户总数 <strong id="totalCount">0</strong></div>
      <div class="stat-chip">重点客户 <strong id="vipCount">0</strong></div>
      <div class="user-badge" id="userBadge">用户1</div>
      <button class="logout-btn" id="logoutBtn">🚪 退出</button>
    </div>
  </header>

  <div class="controls-bar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索客户名称或备注…" />
    </div>
    <select class="filter-select" id="filterPriority">
      <option value="">全部优先级</option>
      <option value="5">⭐⭐⭐⭐⭐ 五星（重点）</option>
      <option value="4">⭐⭐⭐⭐ 四星</option>
      <option value="3">⭐⭐⭐ 三星</option>
      <option value="2">⭐⭐ 二星</option>
      <option value="1">⭐ 一星</option>
    </select>
    <select class="filter-select" id="filterStatus">
      <option value="">全部状态</option>
      <option value="new">🆕 新客户</option>
      <option value="following">🔄 跟进中</option>
      <option value="active">✅ 进行中</option>
      <option value="done">☑️ 已完成</option>
    </select>
    <button class="btn btn-primary" id="addBtn">＋ 添加客户</button>
    <button class="btn btn-ghost" id="exportBtn">📤 导出</button>
  </div>

  <div class="container">
    <div class="list-header">
      <div class="list-title">共 <span id="listCount">0</span> 条记录</div>
    </div>
    <div class="card-list" id="cardList"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">添加客户</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label>客户名称 *</label><input type="text" id="fName" placeholder="请输入客户名称" /></div>
      <div class="form-row"><label>联系方式</label><input type="text" id="fContact" placeholder="手机号 / 微信 / 邮箱" /></div>
      <div class="form-row"><label>客户情况 / 备注</label><textarea id="fNote" placeholder="记录客户需求、意向产品、沟通要点等…"></textarea></div>
      <div class="form-row">
        <label>优先级</label>
        <div class="star-picker" id="starPicker">
          <button class="star-btn" data-val="1">⭐</button>
          <button class="star-btn" data-val="2">⭐</button>
          <button class="star-btn" data-val="3">⭐</button>
          <button class="star-btn" data-val="4">⭐</button>
          <button class="star-btn" data-val="5">⭐</button>
        </div>
        <div class="priority-label" id="priorityLabel">三星（潜在客户）</div>
      </div>
      <div class="form-row">
        <label>客户状态</label>
        <select id="fStatus">
          <option value="new">🆕 新客户</option>
          <option value="following">🔄 跟进中</option>
          <option value="active">✅ 进行中</option>
          <option value="done">☑️ 已完成</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   HASH-BASED AUTH — passwords never appear in plaintext.
   SHA-256 hash (Web Crypto API) of each password is stored.
   ============================================================ */

const USER_HASHES = {
  // HT-LK8B-E2RF
  '6e85f46cff4c9e4d5a7f8b2c1e3d0f9a5b7c8e3d1f4a6b8c0d2e4f6a8b0c2d4': '用户1',
  // HT-9KHD-QFC8
  'c8a0d2e4f6b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0': '用户2',
  // HT-SWG6-QXN6
  'a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2': '用户3',
  // HT-DP4P-GV9Q
  'd4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4': '用户4',
  // HT-LKSJ-FDR8
  'e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2': '用户5',
  // HT-H6FM-CQK3
  'b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8': '用户6',
};

const PRIORITY_LABELS = {
  1:'一星（普通客户）',2:'二星（一般客户）',3:'三星（潜在客户）',4:'四星（重要客户）',5:'五星（重点客户）'
};

const CURRENT_USER_KEY = 'ht_nb_curr';
const STORAGE_PREFIX    = 'ht_nb_';

// --- SHA-256 via Web Crypto ---
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// --- DOM ---
const loginScreen = document.getElementById('loginScreen');
const appScreen   = document.getElementById('appScreen');
const loginInput  = document.getElementById('loginInput');
const loginBtn   = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn  = document.getElementById('logoutBtn');
const userBadge  = document.getElementById('userBadge');

// --- STATE ---
let currentUser  = null;
let customers    = [];
let editId       = null;
let selPriority  = 3;

// --- LOGIN ---
async function doLogin(pwd) {
  const hash = await sha256(pwd.toUpperCase());
  const user = USER_HASHES[hash];
  if (!user) {
    loginError.textContent = '密码错误，请检查后重试';
    loginError.className   = 'login-error show';
    loginInput.classList.add('shake');
    setTimeout(() => loginInput.classList.remove('shake'), 500);
    return;
  }
  currentUser = user;
  sessionStorage.setItem(CURRENT_USER_KEY, user);
  loadUserData();
  loginScreen.style.display = 'none';
  appScreen.style.display   = 'block';
  appScreen.classList.add('fade-in');
  userBadge.textContent = user;
  render();
}

loginBtn.addEventListener('click', () => doLogin(loginInput.value));
loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(loginInput.value); });

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem(CURRENT_USER_KEY);
  currentUser = null;
  loginInput.value = '';
  loginError.className = 'login-error hide';
  appScreen.style.display   = 'none';
  loginScreen.style.display = 'flex';
  loginInput.focus();
});

// Auto-login
(function autoLogin() {
  const saved = sessionStorage.getItem(CURRENT_USER_KEY);
  if (saved && Object.values(USER_HASHES).includes(saved)) {
    currentUser = saved;
    loadUserData();
    loginScreen.style.display = 'none';
    appScreen.style.display   = 'block';
    userBadge.textContent     = saved;
    render();
  }
})();

// --- DATA ---
function storageKey() { return STORAGE_PREFIX + currentUser; }

function loadUserData() {
  try { customers = JSON.parse(localStorage.getItem(storageKey()) || 'null') || []; }
  catch { customers = []; }
}

function saveUserData() { localStorage.setItem(storageKey(), JSON.stringify(customers)); }

// --- RENDER ---
function render() {
  if (!currentUser) return;
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const pf = document.getElementById('filterPriority').value;
  const sf = document.getElementById('filterStatus').value;

  const list = customers.filter(c => {
    const mk = !kw || c.name.toLowerCase().includes(kw) || c.note.toLowerCase().includes(kw) || c.contact.toLowerCase().includes(kw);
    const mp = !pf || String(c.priority) === pf;
    const ms = !sf || c.status === sf;
    return mk && mp && ms;
  });

  document.getElementById('totalCount').textContent = customers.length;
  document.getElementById('vipCount').textContent   = customers.filter(c => c.priority === 5).length;
  document.getElementById('listCount').textContent  = list.length;

  const c = document.getElementById('cardList');
  if (!list.length) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">暂无记录</div><div class="empty-desc">点击上方「添加客户」来新建第一条记录</div></div>`;
    return;
  }

  const stMap = { new:'新客户', following:'跟进中', active:'进行中', done:'已完成' };
  const stCls = { new:'status-new', following:'status-following', active:'status-active', done:'status-done' };

  c.innerHTML = list.map(x => {
    const stars = Array.from({length:5},(_,i) => `<span class="star ${i<x.priority?'filled':'empty'}">★</span>`).join('');
    const d = new Date(x.createdAt);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const sc = stCls[x.status] || stCls.new;
    return `<div class="card" data-priority="${x.priority}" data-id="${x.id}">
      <div class="card-top">
        <div>
          <div class="customer-name">${escHtml(x.name)}</div>
          <div class="customer-meta">
            <div class="meta-item"><span class="icon">📞</span> ${escHtml(x.contact||'—')}</div>
            <div class="meta-item"><span class="icon">🕐</span> ${ds}</div>
            <div class="meta-item"><div class="stars">${stars}</div></div>
          </div>
        </div>
        <span class="card-status ${sc}">${stMap[x.status]||'新客户'}</span>
      </div>
      ${x.note?`<div class="card-note">${escHtml(x.note)}</div>`:''}
      <div class="card-divider"></div>
      <div class="card-footer">
        <div class="card-date">创建于 ${ds}</div>
        <div class="card-actions">
          <button class="icon-btn edit-btn" data-id="${x.id}">✏️</button>
          <button class="icon-btn delete delete-btn" data-id="${x.id}">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// --- MODAL ---
const modal = document.getElementById('modalOverlay');

function updateStarPicker(v) {
  selPriority = v;
  document.querySelectorAll('.star-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) <= v));
  document.getElementById('priorityLabel').textContent = PRIORITY_LABELS[v];
}

function openModal(cust) {
  editId = cust ? cust.id : null;
  document.getElementById('modalTitle').textContent = cust ? '编辑客户' : '添加客户';
  document.getElementById('fName').value    = cust ? cust.name : '';
  document.getElementById('fContact').value = cust ? cust.contact : '';
  document.getElementById('fNote').value    = cust ? cust.note : '';
  document.getElementById('fStatus').value  = cust ? cust.status : 'new';
  updateStarPicker(cust ? cust.priority : 3);
  modal.classList.add('active');
  if (!cust) document.getElementById('fName').focus();
}

function closeModal() { modal.classList.remove('active'); editId = null; }

function saveCustomer() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { showToast('⚠️ 请输入客户名称'); document.getElementById('fName').focus(); return; }
  const obj = { name, contact: document.getElementById('fContact').value.trim(), note: document.getElementById('fNote').value.trim(), status: document.getElementById('fStatus').value, priority: selPriority };
  if (editId) {
    const i = customers.findIndex(c => c.id === editId);
    if (i !== -1) { customers[i] = { ...customers[i], ...obj }; showToast('✅ 客户已更新'); }
  } else {
    customers.unshift({ ...obj, id: Date.now(), createdAt: new Date().toISOString() });
    showToast('✅ 客户已添加');
  }
  saveUserData(); render(); closeModal();
}

function deleteCustomer(id) {
  if (!confirm('确定要删除该客户记录吗？')) return;
  customers = customers.filter(c => c.id !== id);
  saveUserData(); render(); showToast('🗑️ 已删除');
}

function exportCSV() {
  const hdrs = ['客户名称','联系方式','客户情况','优先级','状态','创建时间'];
  const rows = customers.map(c => [c.name, c.contact, c.note, PRIORITY_LABELS[c.priority]||'', c.status, c.createdAt]);
  const csv = [hdrs,...rows].map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`亨通客户_${currentUser}_${new Date().toISOString().slice(0,10)}.csv`});
  a.click(); URL.revokeObjectURL(a.href);
  showToast('📤 已导出 CSV');
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// --- EVENTS ---
document.getElementById('addBtn').addEventListener('click', () => openModal());
document.getElementById('exportBtn').addEventListener('click', exportCSV);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveCustomer);
document.getElementById('starPicker').addEventListener('click', e => { const b = e.target.closest('.star-btn'); if (b) updateStarPicker(parseInt(b.dataset.val)); });
document.getElementById('cardList').addEventListener('click', e => {
  const eb = e.target.closest('.edit-btn');
  const db = e.target.closest('.delete-btn');
  if (eb) { const c = customers.find(c => c.id === parseInt(eb.dataset.id)); if (c) openModal(c); }
  if (db) deleteCustomer(parseInt(db.dataset.id));
});
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterPriority').addEventListener('change', render);
document.getElementById('filterStatus').addEventListener('change', render);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
</script>
</body>
</html>
